<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Skills Index</title>
<style>
:root {
  --bg: #0b0c0f;
  --surface: #14161b;
  --surface-2: #1b1e25;
  --line: #262a33;
  --text: #ecedf0;
  --muted: #8b909c;
  --faint: #5c616d;
  --accent: #d97757;
  --ok: #3fb97a;
  --warn: #e0a83a;
  --bad: #e5534b;
  --off: #6b7080;
  --radius: 12px;
  --fs: 15px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: var(--fs)/1.45 var(--font); overflow: hidden; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.mono { font-family: var(--mono); }

/* header */
header { padding: max(14px, env(safe-area-inset-top)) 16px 10px; background: linear-gradient(var(--bg) 85%, transparent); position: relative; z-index: 2; }
.top { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #1a0f0a; font-weight: 800; font-size: 15px; flex: none; }
.title { flex: 1; min-width: 0; }
.title h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.title .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.search { margin-top: 12px; position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; padding: 0 40px 0 40px; outline: none; }
.search input:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.search input::placeholder { color: var(--faint); }
.search .clear { position: absolute; right: 6px; top: 50%; translate: 0 -50%; width: 32px; height: 32px; color: var(--muted); display: none; }
.search.has .clear { display: grid; place-items: center; }

.scroller { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px -16px 0; padding: 0 16px; }
.scroller::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab b { font-weight: 600; color: var(--faint); font-size: 12px; }
.tab.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.tab.on b { color: color-mix(in srgb, var(--bg) 60%, var(--text)); }
.chip { height: 28px; font-size: 12px; padding: 0 10px; }
.chip.on { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--off); }
.dot.connected, .dot.enabled { background: var(--ok); }
.dot.needs-auth { background: var(--warn); }
.dot.failed { background: var(--bad); }
.dot.unknown { background: var(--faint); }

.banner { margin-top: 10px; display: none; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); font-size: 13px; }
.banner.show { display: flex; }
.banner span { flex: 1; }
.banner button { background: var(--accent); color: #1a0f0a; font-weight: 650; border-radius: 8px; padding: 6px 12px; }

.summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.summary span { display: inline-flex; align-items: center; gap: 6px; }

/* list */
main { flex: 1; overflow-y: auto; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.card:active { background: var(--surface-2); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.badge { flex: none; font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.badge.k-agent { color: #9db4ff; } .badge.k-skill { color: #c4a6ff; } .badge.k-command { color: #7fd1c7; }
.badge.k-plugin { color: var(--accent); } .badge.k-mcp { color: #8fd17f; } .badge.k-hook { color: #e8c46a; } .badge.k-lsp { color: #f08fb6; }
.grp { margin-left: auto; flex: none; max-width: 40%; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desc { margin-top: 5px; font-size: calc(var(--fs) - 1.5px); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.err { margin-top: 6px; font-size: 12px; color: var(--bad); }
.hit { margin-top: 6px; font-size: 12px; color: var(--faint); }
mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--text); border-radius: 3px; padding: 0 1px; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.more { text-align: center; color: var(--faint); font-size: 12px; padding: 12px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; z-index: 11; }
.sheet.show { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { margin: 8px 0 4px; font-size: 20px; letter-spacing: -.01em; word-break: break-word; }
.sheet .slug { font: 12px var(--mono); color: var(--faint); word-break: break-all; }
.sheet .full { margin: 14px 0 0; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.section { margin-top: 18px; }
.section h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
.section p { margin: 0; color: var(--muted); font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; color: var(--muted); word-break: break-all; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-top: 10px; }
.actions { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; height: 42px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0f0a; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 36px; height: 36px; border-radius: 10px; border: 2px solid transparent; }
.swatch.on { border-color: var(--text); }
.seg { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.seg.on { border-color: var(--accent); color: var(--accent); }
.note { font-size: 12px; color: var(--faint); margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); translate: -50% 20px; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: .2s; z-index: 20; pointer-events: none; }
.toast.show { opacity: 1; translate: -50% 0; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">S</div>
    <div class="title">
      <h1>Skills Index</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="banner" id="banner"><span id="bannerText"></span><button id="bannerBtn">Update</button></div>
  <div class="search" id="searchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search names, descriptions, contents…" autocomplete="off" spellcheck="false">
    <button class="clear" id="clear" aria-label="Clear search">✕</button>
  </div>
  <div class="scroller" id="tabs"></div>
  <div class="scroller" id="chips"></div>
  <div class="summary" id="summary"></div>
</header>
<main id="list"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="detail"></div>
<div class="sheet" id="prefs"></div>
<div class="toast" id="toast"></div>

<script>
const KINDS = [
  ["all", "All"], ["agent", "Agents"], ["skill", "Skills"], ["command", "Commands"],
  ["plugin", "Plugins"], ["mcp", "MCP"], ["hook", "Hooks"], ["lsp", "LSP"],
];
const STATUS_LABEL = { connected: "Connected", "needs-auth": "Needs auth", failed: "Failed",
  unknown: "Not checked", "not-configured": "Not configured", enabled: "Enabled", disabled: "Disabled", synced: "Synced from claude.ai" };
const ACCENTS = ["#d97757", "#7c9cff", "#3fb97a", "#c084fc", "#2dd4bf", "#f472b6"];
const PAGE = 150;
const bridge = window.Android || null;

let ITEMS = [], META = {}, SOURCE = "";
let state = { q: "", kind: "all", group: "", status: "" };
let filtered = [], shown = 0;
const $ = (id) => document.getElementById(id);

// ---------- prefs ----------
function pref(key, dflt) { try { return localStorage.getItem(key) ?? dflt; } catch (e) { return dflt; } }
function setPref(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }
function applyPrefs() {
  document.documentElement.style.setProperty("--accent", pref("accent", ACCENTS[0]));
  document.documentElement.style.setProperty("--fs", pref("fs", "15") + "px");
}

// ---------- data ----------
function normalize(data) {
  if (Array.isArray(data)) { // v1 file: [{n,s,c,d,k}]
    return { meta: {}, items: data.map(i => ({ k: i.k || "agent", n: i.n, s: i.s, g: i.c, d: i.d || "",
      body: "", src: "", status: "", err: "", meta: {} })) };
  }
  return { meta: data, items: data.items || [] };
}
window.applyCatalog = function (jsonText, source) {
  try {
    const { meta, items } = normalize(JSON.parse(jsonText));
    if (!items.length) return;
    ITEMS = items.map(i => Object.assign(i, {
      _hay: [i.n, i.s, i.g, i.d, i.body, i.err].join("\n").toLowerCase(),
    }));
    META = meta; SOURCE = source || "";
    render(true);
  } catch (e) { toast("Couldn't read catalog"); }
};
window.showUpdate = function (tag, url) {
  $("bannerText").textContent = `New version ${tag} is available`;
  $("bannerBtn").onclick = () => bridge ? bridge.openUrl(url) : open(url);
  $("banner").classList.add("show");
};
window.setRefreshing = function (on, msg) {
  $("refresh").classList.toggle("spin", !!on);
  if (msg) toast(msg);
};

// ---------- filtering ----------
function terms() { return state.q.toLowerCase().split(/\s+/).filter(Boolean); }
function score(i, ts) {
  let s = 0;
  const n = i.n.toLowerCase();
  for (const t of ts) {
    if (!i._hay.includes(t)) return -1;
    if (n === t) s += 100; else if (n.startsWith(t)) s += 40; else if (n.includes(t)) s += 20;
    else if ((i.d || "").toLowerCase().includes(t)) s += 5; else s += 1;
  }
  return s;
}
function baseSet() { return ITEMS.filter(i => state.kind === "all" || i.k === state.kind); }
function compute() {
  const ts = terms();
  let list = baseSet().filter(i => (!state.group || i.g === state.group) && (!state.status || i.status === state.status));
  if (ts.length) {
    list = list.map(i => [score(i, ts), i]).filter(x => x[0] >= 0).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  }
  return list;
}

// ---------- rendering ----------
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function hl(s) {
  const ts = terms();
  let out = esc(s);
  if (!ts.length) return out;
  const re = new RegExp("(" + ts.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return out.replace(re, "<mark>$1</mark>");
}
function snippet(i) {
  const ts = terms();
  if (!ts.length || !i.body) return "";
  const body = i.body, low = body.toLowerCase();
  if (ts.some(t => (i.n + " " + i.d).toLowerCase().includes(t))) return "";
  const at = low.indexOf(ts.find(t => low.includes(t)) || "\u0000");
  if (at < 0) return "";
  const start = Math.max(0, at - 50);
  return (start ? "…" : "") + body.slice(start, at + 90) + "…";
}
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function renderHeader() {
  const total = ITEMS.length;
  const src = { live: "Live from Claude", file: "Synced file", bundled: "Built-in snapshot" }[SOURCE] || "";
  $("sub").textContent = `${total.toLocaleString()} items` + (src ? ` · ${src}` : "") + (META.generated ? ` · ${ago(META.generated)}` : "");

  const counts = { all: total };
  ITEMS.forEach(i => counts[i.k] = (counts[i.k] || 0) + 1);
  $("tabs").innerHTML = KINDS.filter(([k]) => counts[k]).map(([k, label]) =>
    `<button class="tab${state.kind === k ? " on" : ""}" data-kind="${k}">${label} <b>${counts[k]}</b></button>`).join("");

  const base = baseSet();
  const statusKinds = state.kind === "mcp" || state.kind === "plugin";
  let chips = "";
  if (statusKinds) {
    const sc = {};
    base.forEach(i => sc[i.status || "unknown"] = (sc[i.status || "unknown"] || 0) + 1);
    chips += Object.keys(sc).sort().map(s =>
      `<button class="tab chip${state.status === s ? " on" : ""}" data-status="${s}"><span class="dot ${s}"></span>${STATUS_LABEL[s] || s} <b>${sc[s]}</b></button>`).join("");
  }
  const gc = {};
  base.forEach(i => gc[i.g] = (gc[i.g] || 0) + 1);
  const groups = Object.keys(gc).sort((a, b) => gc[b] - gc[a] || a.localeCompare(b));
  if (groups.length > 1) {
    chips += groups.map(g => `<button class="tab chip${state.group === g ? " on" : ""}" data-group="${esc(g)}">${esc(g)} <b>${gc[g]}</b></button>`).join("");
  }
  $("chips").innerHTML = chips;
  $("chips").style.display = chips ? "" : "none";

  if (state.kind === "mcp") {
    $("summary").innerHTML = META.mcpChecked
      ? `<span>Health checked ${ago(META.mcpChecked)} · tap ↻ to recheck</span>`
      : `<span>Health not checked yet · tap ↻</span>`;
  } else {
    $("summary").innerHTML = "";
  }
}
function cardHtml(i, idx) {
  const st = i.status && i.status !== "synced" ? `<span class="dot ${i.status}" title="${STATUS_LABEL[i.status] || i.status}"></span>` : "";
  const snip = snippet(i);
  return `<button class="card" data-idx="${idx}">
    <div class="row">${st}<span class="name">${hl(i.n)}</span><span class="badge k-${i.k}">${i.k}</span><span class="grp">${esc(i.g)}</span></div>
    ${i.d ? `<div class="desc">${hl(i.d)}</div>` : ""}
    ${i.err ? `<div class="err">${esc(i.err)}</div>` : ""}
    ${snip ? `<div class="hit">${hl(snip)}</div>` : ""}
  </button>`;
}
function renderMore() {
  const list = $("list");
  const next = filtered.slice(shown, shown + PAGE);
  list.querySelector(".more")?.remove();
  list.insertAdjacentHTML("beforeend", next.map((i, n) => cardHtml(i, shown + n)).join(""));
  shown += next.length;
  if (shown < filtered.length) list.insertAdjacentHTML("beforeend", `<div class="more">Showing ${shown} of ${filtered.length}</div>`);
}
function render(resetScroll) {
  renderHeader();
  filtered = compute();
  shown = 0;
  $("list").innerHTML = filtered.length ? "" : `<div class="empty">${ITEMS.length ? "No matches" : "No catalog loaded"}</div>`;
  renderMore();
  if (resetScroll) $("list").scrollTop = 0;
}

// ---------- detail sheet ----------
function openSheet(id) { $("scrim").classList.add("show"); $(id).classList.add("show"); }
function closeSheets() { $("scrim").classList.remove("show"); document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show")); }
function showDetail(i) {
  const m = i.meta || {};
  const rows = [["Kind", i.k], ["Group", i.g], ["Version", m.version], ["Author", m.author],
    ["Endpoint", m.endpoint], ["Event", m.event], ["Matcher", m.matcher],
    ["Installed", m.installed && m.installed.slice(0, 10)], ["Updated", m.updated && m.updated.slice(0, 10)],
    ["Homepage", m.homepage], ["Source", i.src]].filter(r => r[1]);
  const bodyTitle = { plugin: "Contents", hook: "Command", mcp: "Endpoint", lsp: "Command" }[i.k] || "Details";
  $("detail").innerHTML = `<div class="grab"></div>
    <span class="badge k-${i.k}">${i.k}</span>
    <h2>${esc(i.n)}</h2>
    <div class="slug">${esc(i.s)}</div>
    ${i.status ? `<div class="status-pill"><span class="dot ${i.status}"></span>${STATUS_LABEL[i.status] || i.status}</div>` : ""}
    ${i.d ? `<p class="full">${hl(i.d)}</p>` : ""}
    ${i.err ? `<div class="section"><h3>Error</h3><p style="color:var(--bad)">${esc(i.err)}</p></div>` : ""}
    ${i.body && i.k !== "mcp" ? `<div class="section"><h3>${bodyTitle}</h3><p>${hl(i.body)}${i.body.length >= 1500 ? "…" : ""}</p></div>` : ""}
    <div class="section"><h3>Info</h3><dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
    <div class="actions">
      <button class="btn primary" id="copyName">Copy ${i.k === "command" ? "command" : "name"}</button>
      ${m.homepage ? `<button class="btn" id="openHome">Open homepage</button>` : ""}
    </div>`;
  $("copyName").onclick = () => copy(i.k === "command" ? i.s : i.k === "agent" || i.k === "skill" ? i.s : i.n);
  if (m.homepage) $("openHome").onclick = () => bridge ? bridge.openUrl(m.homepage) : open(m.homepage);
  $("detail").scrollTop = 0;
  openSheet("detail");
}
function copy(text) {
  if (bridge) bridge.copy(text); else navigator.clipboard?.writeText(text);
  toast("Copied " + text);
}
let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1800);
}

// ---------- settings sheet ----------
function showPrefs() {
  const acc = pref("accent", ACCENTS[0]), fs = pref("fs", "15");
  const ver = bridge ? bridge.versionName() : "web";
  $("prefs").innerHTML = `<div class="grab"></div><h2>Settings</h2>
    <div class="section"><h3>Accent</h3><div class="opts">${ACCENTS.map(c =>
      `<button class="swatch${c === acc ? " on" : ""}" data-accent="${c}" style="background:${c}"></button>`).join("")}</div></div>
    <div class="section"><h3>Text size</h3><div class="opts">${[["13", "Small"], ["15", "Medium"], ["17", "Large"]].map(([v, l]) =>
      `<button class="seg${v === fs ? " on" : ""}" data-fs="${v}">${l}</button>`).join("")}</div></div>
    <div class="section"><h3>Sync with Claude Code</h3>
      <p>The app reads live data from the Skills Index helper on this phone, which Claude Code starts on every session.
      If it isn't running, the app uses the last synced file, then the built-in snapshot.</p>
      <div class="actions"><button class="btn" id="pickFile">Choose sync file…</button><button class="btn" id="checkUpd">Check for update</button></div>
      <div class="note">Version ${esc(ver)} · Source: ${esc(SOURCE || "none")}${META.generated ? " · exported " + ago(META.generated) : ""}</div>
    </div>`;
  $("prefs").querySelectorAll("[data-accent]").forEach(b => b.onclick = () => { setPref("accent", b.dataset.accent); applyPrefs(); showPrefs(); });
  $("prefs").querySelectorAll("[data-fs]").forEach(b => b.onclick = () => { setPref("fs", b.dataset.fs); applyPrefs(); showPrefs(); });
  $("pickFile").onclick = () => bridge ? bridge.pickCatalogFile() : toast("Only in the app");
  $("checkUpd").onclick = () => bridge ? bridge.checkUpdate(true) : toast("Only in the app");
  openSheet("prefs");
}

// ---------- events ----------
let qTimer;
$("q").addEventListener("input", e => {
  $("searchWrap").classList.toggle("has", !!e.target.value);
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value; render(true); }, 120);
});
$("clear").onclick = () => { $("q").value = ""; $("searchWrap").classList.remove("has"); state.q = ""; render(true); };
$("tabs").onclick = e => {
  const b = e.target.closest("[data-kind]"); if (!b) return;
  state.kind = b.dataset.kind; state.group = ""; state.status = ""; render(true);
};
$("chips").onclick = e => {
  const g = e.target.closest("[data-group]"), s = e.target.closest("[data-status]");
  if (g) state.group = state.group === g.dataset.group ? "" : g.dataset.group;
  if (s) state.status = state.status === s.dataset.status ? "" : s.dataset.status;
  if (g || s) render(true);
};
$("list").onclick = e => { const c = e.target.closest(".card"); if (c) showDetail(filtered[+c.dataset.idx]); };
$("list").onscroll = () => {
  const l = $("list");
  if (shown < filtered.length && l.scrollTop + l.clientHeight > l.scrollHeight - 600) renderMore();
};
$("scrim").onclick = closeSheets;
$("settings").onclick = showPrefs;
$("refresh").onclick = () => bridge ? bridge.refresh() : toast("Only in the app");
window.onBack = function () { // called by native back button; true = handled
  if (document.querySelector(".sheet.show")) { closeSheets(); return true; }
  if (state.q || state.group || state.status || state.kind !== "all") {
    $("q").value = ""; $("searchWrap").classList.remove("has");
    state = { q: "", kind: "all", group: "", status: "" }; render(true); return true;
  }
  return false;
};

applyPrefs();
render(true);
</script>
</body>
</html>
