als for Artifacts. Load before writing any artifact.","k":"skill"},{"n":"artifact-diagramming","s":"artifact-diagramming","c":"Claude Code Skill","d":"Diagramming know-how for Artifacts — drawing mechanism diagrams and inline-SVG mechanics.","k":"skill"},{"n":"artifact-capabilities","s":"artifact-capabilities","c":"Claude Code Skill","d":"Runtime capabilities a published Artifact page can be granted — live data, saved state, shared state, user identity, file storage.","k":"skill"},{"n":"update-config","s":"update-config","c":"Claude Code Skill","d":"Configure the Claude Code harness via settings.json — hooks, permissions, env vars.","k":"skill"},{"n":"keybindings-help","s":"keybindings-help","c":"Claude Code Skill","d":"Customize keyboard shortcuts, rebind keys, add chord bindings, modify keybindings.json.","k":"skill"},{"n":"code-review","s":"code-review","c":"Claude Code Skill","d":"Review the current diff or a PR/branch for correctness bugs and simplification opportunities.","k":"skill"},{"n":"simplify","s":"simplify","c":"Claude Code Skill","d":"Review changed code for reuse, simplification, efficiency, and apply the fixes.","k":"skill"},{"n":"fewer-permission-prompts","s":"fewer-permission-prompts","c":"Claude Code Skill","d":"Scan transcripts for common read-only tool calls and allowlist them in settings.json.","k":"skill"},{"n":"loop","s":"loop","c":"Claude Code Skill","d":"Run a prompt or slash command on a recurring interval, self-paced or fixed.","k":"skill"},{"n":"schedule","s":"schedule","c":"Claude Code Skill","d":"Create, update, list, or run scheduled cloud agents (cron routines).","k":"skill"},{"n":"claude-api","s":"claude-api","c":"Claude Code Skill","d":"Reference for the Claude API / Anthropic SDK — models, pricing, params, streaming, tool use.","k":"skill"},{"n":"claude-in-chrome","s":"claude-in-chrome","c":"Claude Code Skill","d":"Automate Chrome to click, fill forms, screenshot, and navigate sites.","k":"skill"},{"n":"run","s":"run","c":"Claude Code Skill","d":"Launch and drive this project's app to see a change working in a real browser/CLI.","k":"skill"},{"n":"init","s":"init","c":"Claude Code Skill","d":"Initialize a new CLAUDE.md file with codebase documentation.","k":"skill"},{"n":"security-review","s":"security-review","c":"Claude Code Skill","d":"Complete a security review of the pending changes on the current branch.","k":"skill"}];
const CATS = ["Academic", "Claude Code Skill", "Design", "Engineering", "Finance", "GIS", "Game Dev", "Healthcare", "Marketing", "Other", "Paid Media", "Product", "Project Mgmt", "Research", "Sales", "Security", "Spatial Computing", "Specialized", "Support", "Testing"];
let query = '';
let activeCat = 'All';

function render() {
  const q = query.trim().toLowerCase();
  const filtered = CATALOG.filter(i => {
    if (activeCat !== 'All' && i.c !== activeCat) return false;
    if (!q) return true;
    return i.n.toLowerCase().includes(q) || i.s.toLowerCase().includes(q) ||
           i.d.toLowerCase().includes(q) || i.c.toLowerCase().includes(q);
  });

  document.getElementById('count').textContent = filtered.length + ' / ' + CATALOG.length + ' entries';

  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  ['All', ...CATS].forEach(c => {
    const count = c === 'All' ? CATALOG.length : CATALOG.filter(i => i.c === c).length;
    const el = document.createElement('div');
    el.className = 'chip mono' + (c === activeCat ? ' active' : '');
    el.textContent = c + ' (' + count + ')';
    el.onclick = () => { activeCat = c; render(); };
    chips.appendChild(el);
  });

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.style.display = filtered.length === 0 ? 'block' : 'none';
  const frag = document.createDocumentFragment();
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<div class="item-top">' +
        '<div class="item-name"></div>' +
        '<div class="item-slug mono"></div>' +
        '<div class="item-cat mono"></div>' +
      '</div>' +
      '<div class="item-desc"></div>';
    div.querySelector('.item-name').textContent = item.n;
    div.querySelector('.item-slug').textContent = item.s;
    div.querySelector('.item-cat').textContent = item.c;
    div.querySelector('.item-desc').textContent = item.d;
    frag.appendChild(div);
  });
  list.appendChild(frag);
}

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

render();
</script>
